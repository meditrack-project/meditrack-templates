name: "Template — Snyk SCA"

on:
  workflow_call:
    inputs:
      service_name:
        description: "Human-readable service name"
        required: true
        type: string
      service_path:
        description: "Path to service directory relative to repo root"
        required: true
        type: string
      language:
        description: "Runtime language: python or javascript"
        required: true
        type: string
      python_version:
        description: "Python version (python services only)"
        required: false
        type: string
        default: "3.12"
      node_version:
        description: "Node.js version (javascript services only)"
        required: false
        type: string
        default: "20"
    secrets:
      SNYK_TOKEN:
        required: true
      SMTP_USERNAME:
        required: true
      SMTP_PASSWORD:
        required: true
      ALERT_EMAIL:
        required: true

jobs:
  snyk:
    name: "2. Snyk SCA — ${{ inputs.service_name }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    # continue-on-error: Snyk reports findings but never blocks the pipeline
    # Change to false if you want HIGH/CRITICAL to block builds

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Python setup ──────────────────────────────────────
      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python Dependencies
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: pip install --no-cache-dir -r requirements.txt

      # ── JavaScript setup ──────────────────────────────────
      - name: Setup Node.js
        if: inputs.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install JS Dependencies
        if: inputs.language == 'javascript'
        working-directory: ${{ inputs.service_path }}
        run: npm install

      # ── Snyk CLI setup ────────────────────────────────────
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Install snyk-to-html
        run: npm install -g snyk-to-html

      # ── Snyk scan (Python) ────────────────────────────────
      - name: Snyk Security Scan (Python)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --severity-threshold=high \
            --json-file-output=snyk-report.json \
          || true
          # || true — never exit non-zero (continue-on-error handles reporting)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # ── Snyk scan (JavaScript) ────────────────────────────
      - name: Snyk Security Scan (JavaScript)
        if: inputs.language == 'javascript'
        working-directory: ${{ inputs.service_path }}
        run: |
          snyk test \
            --file=package.json \
            --severity-threshold=high \
            --json-file-output=snyk-report.json \
          || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # ── Convert JSON → HTML report ────────────────────────
      - name: Convert Snyk Report to HTML
        if: always()
        working-directory: ${{ inputs.service_path }}
        run: |
          if [ -f snyk-report.json ]; then
            snyk-to-html -i snyk-report.json -o snyk-report.html
            echo "Snyk HTML report generated"
          else
            echo "No Snyk JSON report found — scan may have errored"
          fi

      # ── Upload report artifact ────────────────────────────
      - name: Upload Snyk Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report-${{ inputs.service_name }}
          path: |
            ${{ inputs.service_path }}/snyk-report.html
            ${{ inputs.service_path }}/snyk-report.json
          retention-days: 14
          if-no-files-found: ignore

      # ── Snyk monitor (tracks over time in dashboard) ──────
      - name: Snyk Monitor
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        working-directory: ${{ inputs.service_path }}
        run: |
          snyk monitor \
            --project-name=${{ inputs.service_name }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # ── Email on failure ───────────────────────────────────
      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "MediTrack CI Failed — Snyk (${{ inputs.service_name }})"
          to: ${{ secrets.ALERT_EMAIL }}
          from: MediTrack CI Pipeline
          body: |
            Snyk SCA scan FAILED for: ${{ inputs.service_name }}

            Branch : ${{ github.ref_name }}
            Commit : ${{ github.sha }}
            Author : ${{ github.actor }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
