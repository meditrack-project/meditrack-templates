name: "Template — Docker Build, Trivy & Push"

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      docker_image_name:
        required: true
        type: string
      language:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SMTP_USERNAME:
        required: true
      SMTP_PASSWORD:
        required: true
      ALERT_EMAIL:
        required: true
    outputs:
      version:
        description: "Clean semantic version e.g. v2.0.1"
        value: ${{ jobs.docker.outputs.version }}
      image_tag:
        description: "Full image tag e.g. v2.0.1-dev or v2.0.1"
        value: ${{ jobs.docker.outputs.image_tag }}

jobs:
  docker:
    name: "3,4,5. Docker — ${{ inputs.service_name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Semantic Version
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          tag_prefix: "${{ inputs.service_name }}/v"
          default_bump: patch
          initial_version: "2.0.0"
          custom_release_rules: "feat:minor:Features,feat!:major:Breaking Changes,breaking:major:Breaking Changes"
          dry_run: ${{ inputs.branch != 'main' }}

      - name: Extract Image Tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          RAW_VERSION="${{ steps.version.outputs.new_version }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker_image_name }}"
          BRANCH="${{ inputs.branch }}"

          VERSION=$(echo "$RAW_VERSION" | sed 's/-.*$//')

          if [ "$BRANCH" = "main" ]; then
            VERSIONED_TAG="${IMAGE}:v${VERSION}"
            SHA_TAG="${IMAGE}:v${VERSION}-${SHORT_SHA}"
            LATEST_TAG="${IMAGE}:latest"
            OUTPUT_TAG="v${VERSION}"
          else
            VERSIONED_TAG="${IMAGE}:v${VERSION}-dev"
            SHA_TAG="${IMAGE}:v${VERSION}-${SHORT_SHA}-dev"
            LATEST_TAG="${IMAGE}:dev-latest"
            OUTPUT_TAG="v${VERSION}-dev"
          fi

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tag_version=${VERSIONED_TAG}" >> $GITHUB_OUTPUT
          echo "tag_sha=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "tag_latest=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${OUTPUT_TAG}" >> $GITHUB_OUTPUT

          echo "Raw version   : ${RAW_VERSION}"
          echo "Clean version : ${VERSION}"
          echo "Final tag     : ${OUTPUT_TAG}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Python)
        if: inputs.language == 'python'
        run: |
          for i in 1 2 3; do
            echo "Attempt ${i}/3"
            docker build \
              -t ${{ steps.meta.outputs.tag_version }} \
              -t ${{ steps.meta.outputs.tag_sha }} \
              -t ${{ steps.meta.outputs.tag_latest }} \
              -f ${{ inputs.service_path }}/Dockerfile \
              ${{ inputs.service_path }} \
            && echo "Build succeeded" && break

            if [ $i -lt 3 ]; then
              echo "Build failed — waiting 30s before retry..."
              sleep 30
            else
              echo "Build failed after 3 attempts"
              exit 1
            fi
          done

      - name: Build Docker Image (JavaScript)
        if: inputs.language == 'javascript'
        run: |
          for i in 1 2 3; do
            echo "Attempt ${i}/3"
            docker build \
              -t ${{ steps.meta.outputs.tag_version }} \
              -t ${{ steps.meta.outputs.tag_sha }} \
              -t ${{ steps.meta.outputs.tag_latest }} \
              --build-arg VITE_USER_SERVICE_URL=https://meditrack.prod.local/api/users \
              --build-arg VITE_MEDICAL_SERVICE_URL=https://meditrack.prod.local/api/medical \
              --build-arg VITE_HEALTH_SERVICE_URL=https://meditrack.prod.local/api/health \
              --build-arg VITE_AI_SERVICE_URL=https://meditrack.prod.local/api/ai \
              -f ${{ inputs.service_path }}/Dockerfile \
              ${{ inputs.service_path }} \
            && echo "Build succeeded" && break

            if [ $i -lt 3 ]; then
              echo "Build failed — waiting 30s before retry..."
              sleep 30
            else
              echo "Build failed after 3 attempts"
              exit 1
            fi
          done

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tag_version }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Trivy Full Report
        if: success()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tag_version }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: "os,library"
          output: trivy-report.txt

      - name: Upload Trivy Report Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ inputs.service_name }}
          path: trivy-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Push Docker Image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.meta.outputs.tag_version }}
          docker push ${{ steps.meta.outputs.tag_sha }}
          docker push ${{ steps.meta.outputs.tag_latest }}

      - name: Write Job Summary
        if: success()
        run: |
          echo "## Docker Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ inputs.service_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ inputs.branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ steps.meta.outputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA Tag | ${{ steps.meta.outputs.tag_sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest Tag | ${{ steps.meta.outputs.tag_latest }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | Passed |" >> $GITHUB_STEP_SUMMARY

      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "MediTrack CI Failed — Docker (${{ inputs.service_name }})"
          to: ${{ secrets.ALERT_EMAIL }}
          from: MediTrack CI Pipeline
          body: |
            Docker build/Trivy/push FAILED for: ${{ inputs.service_name }}

            Image  : ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker_image_name }}
            Branch : ${{ github.ref_name }}
            Commit : ${{ github.sha }}
            Author : ${{ github.actor }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
